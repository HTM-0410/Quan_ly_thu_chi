# Supabase local stack + auth config
# Local: `supabase start` sẽ dùng file này để khởi tạo các service.
# Production: deploy lên Supabase Cloud qua `supabase db push` và cấu hình
# Auth qua Dashboard (Site URL, Additional Redirect URLs).

[interface]
enabled = true
port = 54321
slot_name = supabase_slot_main

[api]
enabled = true
port = 54321

[db]
port = 54322
shadow_port = 54320
major_version = 15

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000",
  "http://localhost:5173",
  # Thêm domain production của bạn vào đây, ví dụ:
  # "https://quan-ly-thu-chi.example.com"
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[functions]
verify_jwt = true