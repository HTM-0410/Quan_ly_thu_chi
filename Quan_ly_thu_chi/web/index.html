<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: Fraunces (display serif), Noto Sans (Vietnamese support), JetBrains Mono (numeric) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Noto+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-flash theme bootstrap (runs before React mounts) & iOS/Network fixes -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('qltc.theme');
          var mode = stored || 'system';
          var resolved =
            mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (resolved) document.documentElement.classList.add('dark');
        } catch (_) {}

        // Polyfill crypto.randomUUID cho môi trường non-secure (truy cập qua IP mạng LAN như 192.168.x.x)
        try {
          if (typeof window !== 'undefined') {
            if (!window.crypto) {
              window.crypto = {};
            }
            if (typeof window.crypto.randomUUID !== 'function') {
              window.crypto.randomUUID = function () {
                try {
                  return '10000000-1000-4000-8000-100000000000'.replace(/[018]/g, function (c) {
                    return (
                      c ^
                      ((window.crypto.getRandomValues
                        ? window.crypto.getRandomValues(new Uint8Array(1))[0]
                        : Math.floor(Math.random() * 256)) &
                        (15 >> (c / 4)))
                    ).toString(16);
                  });
                } catch (_) {
                  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (ch) {
                    var r = (Math.random() * 16) | 0;
                    return (ch === 'x' ? r : (r & 0x3) | 0x8).toString(16);
                  });
                }
              };
            }
          }
        } catch (_) {}

        // Vô hiệu hóa cử chỉ phóng to đa điểm (pinch-to-zoom) trên iOS Safari
        document.addEventListener('gesturestart', function (e) {
          e.preventDefault();
        });
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Quản lý thu chi</title>
    <meta name="title" content="Quản lý thu chi" />
    <meta
      name="description"
      content="Ứng dụng web cá nhân để theo dõi thu chi, tài khoản, ngân sách, mục tiêu tiết kiệm và giao dịch định kỳ."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Quản lý thu chi" />
    <meta
      property="og:description"
      content="Theo dõi thu chi cá nhân, đồng bộ ngân hàng qua Casso, quản lý ngân sách và mục tiêu tiết kiệm."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Quản lý thu chi" />
    <meta
      name="twitter:description"
      content="Theo dõi thu chi cá nhân, đồng bộ ngân hàng qua Casso, quản lý ngân sách và mục tiêu tiết kiệm."
    />

    <!-- Security hints -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body class="bg-surface text-ink-900 dark:bg-surface-dark dark:text-ink-dark-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
