<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#faf7f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15110d" media="(prefers-color-scheme: dark)" />

    <!-- Fonts: Fraunces (display serif), Inter (body), JetBrains Mono (numeric) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Anti-flash theme bootstrap (runs before React mounts) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('qltc.theme');
          var mode = stored || 'system';
          var resolved =
            mode === 'dark' || (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (resolved) document.documentElement.classList.add('dark');
        } catch (_) {}
      })();
    </script>

    <!-- Primary Meta Tags -->
    <title>Quản lý thu chi</title>
    <meta name="title" content="Quản lý thu chi" />
    <meta
      name="description"
      content="Ứng dụng web cá nhân để theo dõi thu chi, tài khoản, ngân sách, mục tiêu tiết kiệm và giao dịch định kỳ."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="vi_VN" />
    <meta property="og:title" content="Quản lý thu chi" />
    <meta
      property="og:description"
      content="Theo dõi thu chi cá nhân, đồng bộ ngân hàng qua Casso, quản lý ngân sách và mục tiêu tiết kiệm."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Quản lý thu chi" />
    <meta
      name="twitter:description"
      content="Theo dõi thu chi cá nhân, đồng bộ ngân hàng qua Casso, quản lý ngân sách và mục tiêu tiết kiệm."
    />

    <!-- Security hints -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
  </head>
  <body class="bg-surface text-ink-900 dark:bg-surface-dark dark:text-ink-dark-900 antialiased font-sans">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
